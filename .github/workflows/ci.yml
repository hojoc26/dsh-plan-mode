name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 语法检查
        run: |
          node --check lib/index.js
          node --check lib/client.js

      - name: 冒烟测试
        run: node --test

      - name: 检查发布内容
        run: npm pack --dry-run

  package:
    name: 打 Release 包
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 生成可安装 zip
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release/dsh-plan-mode
          cp package.json README.md LICENSE CHANGELOG.md release/dsh-plan-mode/
          cp -R lib release/dsh-plan-mode/lib
          (cd release && zip -r "dsh-plan-mode-${version}.zip" dsh-plan-mode)

      - name: 附加到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
